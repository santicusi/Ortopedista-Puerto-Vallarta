<script>
(function() {
  const nav = document.getElementById('navbar');
  const burger = document.getElementById('navBurger');
  const translateBtn = document.getElementById('translateToggle');
  const translateLabel = document.getElementById('translateLabel');

  if (!nav) return;

  // Scroll behavior — fondo más sólido cuando se hace scroll
  const handleScroll = () => {
    nav.classList.toggle('scrolled', window.scrollY > 12);
  };
  window.addEventListener('scroll', handleScroll, { passive: true });
  handleScroll();

  // Toggle móvil
  if (burger) {
    burger.addEventListener('click', () => {
      const isOpen = nav.classList.toggle('is-open');
      burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }

  // Marcar enlace activo según URL
  try {
    const path = location.pathname.split('/').pop().toLowerCase();
    const links = nav.querySelectorAll('.navbar__link, .navbar__dropdown-item');
    links.forEach(l => {
      const href = (l.getAttribute('href') || '').toLowerCase();
      if (href && href === path) l.classList.add('is-active');
    });
    if (path === '' || path === 'index.html') {
      const home = nav.querySelector('[data-nav="home"]');
      if (home) home.classList.add('is-active');
    }
  } catch (e) { /* noop */ }

  // Google Translate toggle ES <-> EN
  let currentLang = 'es';
  // Cargar Google Translate script una sola vez
  window.googleTranslateElementInit = function() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'es,en',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  };
  const scriptEl = document.createElement('script');
  scriptEl.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  scriptEl.async = true;
  document.head.appendChild(scriptEl);

  function setCookie(name, value) {
    const domains = [location.hostname, '.' + location.hostname];
    domains.forEach(d => {
      document.cookie = `${name}=${value}; path=/; domain=${d}; max-age=31536000`;
    });
    document.cookie = `${name}=${value}; path=/; max-age=31536000`;
  }

  if (translateBtn) {
    translateBtn.addEventListener('click', () => {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      translateLabel.textContent = currentLang === 'es' ? 'EN' : 'ES';
      translateBtn.setAttribute('aria-label', currentLang === 'es' ? 'Cambiar idioma a inglés' : 'Cambiar idioma a español');
      setCookie('googtrans', currentLang === 'en' ? '/es/en' : '/es/es');
      location.reload();
    });

    // Detectar estado actual al cargar
    const match = document.cookie.match(/googtrans=\/es\/(en|es)/);
    if (match && match[1] === 'en') {
      currentLang = 'en';
      translateLabel.textContent = 'ES';
      translateBtn.setAttribute('aria-label', 'Cambiar idioma a español');
    }
  }
})();
</script>
